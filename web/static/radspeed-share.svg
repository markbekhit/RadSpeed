<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">RadSpeed radiology reporting workflow</title>
  <desc id="desc">A dark reporting workspace showing natural dictation becoming a structured radiology report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a12"/>
      <stop offset="1" stop-color="#0b1728"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(850 145) rotate(140) scale(560 390)">
      <stop stop-color="#18d6b2" stop-opacity=".22"/>
      <stop offset="1" stop-color="#18d6b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000" flood-opacity=".44"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <g fill="#18d6b2" transform="translate(74 61)">
    <rect x="0" y="26" width="8" height="20" rx="4" opacity=".45"/>
    <rect x="14" y="16" width="8" height="40" rx="4" opacity=".7"/>
    <rect x="28" y="5" width="8" height="62" rx="4"/>
    <rect x="42" y="18" width="8" height="36" rx="4" opacity=".7"/>
    <rect x="56" y="28" width="8" height="16" rx="4" opacity=".45"/>
  </g>
  <text x="158" y="108" fill="#f4f8ff" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">RadSpeed</text>
  <text x="75" y="214" fill="#f4f8ff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Dictate naturally.</text>
  <text x="75" y="276" fill="#f4f8ff" font-family="Arial, Helvetica, sans-serif" font-size="54" font-weight="700">Finish the report.</text>
  <text x="75" y="329" fill="#9eafc4" font-family="Arial, Helvetica, sans-serif" font-size="23">Your style. Your final decision.</text>
  <g transform="translate(75 392)">
    <rect width="330" height="78" rx="16" fill="#0c1829" stroke="#233752"/>
    <circle cx="42" cy="39" r="10" fill="#ff5b6e"/>
    <rect x="71" y="32" width="5" height="14" rx="2.5" fill="#18d6b2"/>
    <rect x="83" y="25" width="5" height="28" rx="2.5" fill="#18d6b2" opacity=".8"/>
    <rect x="95" y="18" width="5" height="42" rx="2.5" fill="#18d6b2"/>
    <rect x="107" y="28" width="5" height="22" rx="2.5" fill="#18d6b2" opacity=".7"/>
    <rect x="119" y="23" width="5" height="32" rx="2.5" fill="#18d6b2"/>
    <text x="152" y="46" fill="#dce8f6" font-family="Arial, Helvetica, sans-serif" font-size="18">Dictation ready</text>
  </g>
  <text x="75" y="535" fill="#18d6b2" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700">Built for AU/NZ radiologists</text>
  <g transform="translate(548 88)" filter="url(#shadow)">
    <rect width="580" height="470" rx="22" fill="#08111e" stroke="#294260"/>
    <rect width="580" height="58" rx="22" fill="#0e1b2d"/>
    <rect y="38" width="580" height="20" fill="#0e1b2d"/>
    <circle cx="31" cy="29" r="6" fill="#18d6b2"/>
    <text x="49" y="36" fill="#dce8f6" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="700">MR Lumbar Spine</text>
    <rect x="445" y="16" width="111" height="26" rx="13" fill="#123b36"/>
    <text x="466" y="34" fill="#6ce5c9" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700">PRELIMINARY</text>
    <line x1="190" y1="58" x2="190" y2="470" stroke="#20344d"/>
    <text x="24" y="96" fill="#7f94ad" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">CURRENT STUDY</text>
