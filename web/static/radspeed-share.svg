    <text x="24" y="145" fill="#96a9bf" font-family="Arial, Helvetica, sans-serif" font-size="12">Synthetic case</text>
    <text x="24" y="194" fill="#7f94ad" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">FORMAT</text>
    <rect x="24" y="209" width="137" height="30" rx="15" fill="#16374a" stroke="#236486"/>
    <text x="41" y="229" fill="#c7eafd" font-family="Arial, Helvetica, sans-serif" font-size="12">Structured report</text>
    <text x="215" y="96" fill="#18d6b2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">FINDINGS</text>
    <text x="215" y="127" fill="#d8e4f2" font-family="Arial, Helvetica, sans-serif" font-size="14">Lumbar lordosis is maintained.</text>
    <text x="215" y="152" fill="#d8e4f2" font-family="Arial, Helvetica, sans-serif" font-size="14">L4/5 right paracentral disc protrusion</text>
    <text x="215" y="176" fill="#d8e4f2" font-family="Arial, Helvetica, sans-serif" font-size="14">contacts the descending right L5 nerve root.</text>
    <text x="215" y="231" fill="#18d6b2" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700">IMPRESSION</text>
    <rect x="215" y="250" width="334" height="58" rx="10" fill="#0c2630" stroke="#195463"/>
    <circle cx="239" cy="279" r="13" fill="#18d6b2"/>
    <text x="235" y="284" fill="#03110e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">1</text>
    <text x="262" y="274" fill="#edf8fb" font-family="Arial, Helvetica, sans-serif" font-size="13">L4/5 right paracentral disc protrusion</text>
    <text x="262" y="294" fill="#edf8fb" font-family="Arial, Helvetica, sans-serif" font-size="13">contacts the right L5 nerve root.</text>
    <rect x="215" y="322" width="334" height="58" rx="10" fill="#0c2630" stroke="#195463"/>
    <circle cx="239" cy="351" r="13" fill="#18d6b2"/>
    <text x="235" y="356" fill="#03110e" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700">2</text>
    <text x="262" y="346" fill="#edf8fb" font-family="Arial, Helvetica, sans-serif" font-size="13">Moderate right L4/5 foraminal stenosis.</text>
    <text x="262" y="366" fill="#9eb3c8" font-family="Arial, Helvetica, sans-serif" font-size="12">Ready for radiologist review.</text>
    <rect x="215" y="416" width="334" height="34" rx="10" fill="#10243a"/>
    <path d="M234 433l6 6 10-12" fill="none" stroke="#18d6b2" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="264" y="439" fill="#a8bdd1" font-family="Arial, Helvetica, sans-serif" font-size="12">Advisory QA complete</text>
  </g>
