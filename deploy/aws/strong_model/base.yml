AWSTemplateFormatVersion: "2010-09-09"
Description: Low-idle-cost RadSpeed strong fracture model resources

Parameters:
  BudgetEmail:
    Type: String
    Default: markbekhit@gmail.com

Resources:
  ModelBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: RemoveTransientStudies
            Status: Enabled
            Prefix: async-
            ExpirationInDays: 1
      VersioningConfiguration:
        Status: Enabled
      Tags:
        - Key: Project
          Value: RadSpeed

  ModelRepository:
    Type: AWS::ECR::Repository
    Properties:
      RepositoryName: radspeed/strong-fracture-model
      ImageScanningConfiguration:
        ScanOnPush: true
      ImageTagMutability: IMMUTABLE
      EncryptionConfiguration:
        EncryptionType: AES256
      LifecyclePolicy:
        LifecyclePolicyText: |
          {
            "rules": [
              {
                "rulePriority": 1,
                "description": "Keep the three most recent model images",
                "selection": {
                  "tagStatus": "any",
                  "countType": "imageCountMoreThan",
                  "countNumber": 3
                },
                "action": {"type": "expire"}
              }
            ]
          }

  BuildRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: codebuild.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: BuildAndPushModelImage
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:CompleteLayerUpload
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:PutImage
                  - ecr:UploadLayerPart
                Resource: !GetAtt ModelRepository.Arn

  ModelImageBuild:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: radspeed-strong-fracture-model
      ServiceRole: !GetAtt BuildRole.Arn
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_LARGE
        Image: aws/codebuild/standard:7.0
        Type: LINUX_CONTAINER
        PrivilegedMode: true
        EnvironmentVariables:
          - Name: IMAGE_REPO_URI
            Value: !GetAtt ModelRepository.RepositoryUri
          - Name: AWS_DEFAULT_REGION
            Value: !Ref AWS::Region
      Source:
        Type: GITHUB
        Location: https://github.com/markbekhit/RadSpeed.git
        GitCloneDepth: 1
        BuildSpec: deploy/aws/strong_model/buildspec.yml
      SourceVersion: refs/heads/main
      TimeoutInMinutes: 60
      Tags:
        - Key: Project
          Value: RadSpeed

  SageMakerExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: radspeed-strong-fracture-sagemaker
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: sagemaker.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: RunPrivateFractureEndpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:PutObject
                  - s3:AbortMultipartUpload
                Resource: !Sub "${ModelBucket.Arn}/*"
              - Effect: Allow
                Action:
                  - s3:GetBucketLocation
                  - s3:ListBucket
                Resource: !GetAtt ModelBucket.Arn
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: "*"
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                Resource: !GetAtt ModelRepository.Arn
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: "*"

  WebModelUser:
    Type: AWS::IAM::User
    Properties:
      UserName: radspeed-web-strong-fracture
      Policies:
        - PolicyName: InvokePrivateFractureEndpoint
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - s3:PutObject
                  - s3:GetObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "${ModelBucket.Arn}/async-input/*"
                  - !Sub "${ModelBucket.Arn}/async-output/*"
                  - !Sub "${ModelBucket.Arn}/async-failure/*"
              - Effect: Allow
                Action: sagemaker:InvokeEndpointAsync
                Resource: !Sub "arn:${AWS::Partition}:sagemaker:${AWS::Region}:${AWS::AccountId}:endpoint/radspeed-strong-fracture"

  SageMakerBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: radspeed-strong-fracture-monthly
        BudgetLimit:
          Amount: 25
          Unit: USD
        BudgetType: COST
        CostFilters:
          Service:
            - Amazon SageMaker
        TimeUnit: MONTHLY
      NotificationsWithSubscribers:
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: FORECASTED
            Threshold: 60
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL
        - Notification:
            ComparisonOperator: GREATER_THAN
            NotificationType: ACTUAL
            Threshold: 100
            ThresholdType: PERCENTAGE
          Subscribers:
            - Address: !Ref BudgetEmail
              SubscriptionType: EMAIL

Outputs:
  BucketName:
    Value: !Ref ModelBucket
  BuildProjectName:
    Value: !Ref ModelImageBuild
  EcrRepositoryUri:
    Value: !GetAtt ModelRepository.RepositoryUri
  SageMakerExecutionRoleArn:
    Value: !GetAtt SageMakerExecutionRole.Arn
  WebModelUserName:
    Value: !Ref WebModelUser
